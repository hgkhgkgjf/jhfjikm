<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SkyPulse Weather</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 可选：谷歌字体，不需要可删除 -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 全局基础设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top left, #4f7df3 0, transparent 55%),
                radial-gradient(circle at bottom right, #e74d9c 0, transparent 55%),
                linear-gradient(135deg, #050816 0%, #0a0f1f 40%, #050816 100%);
            color: #f5f7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        /* 页面外层布局 */
        .shell-layout {
            width: 100%;
            max-width: 1220px;
            min-height: 640px;
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.02));
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            display: grid;
            grid-template-columns: minmax(0, 1.8fr) minmax(0, 1.2fr);
            overflow: hidden;
            position: relative;
        }

        /* 左侧主区域 */
        .primary-panel {
            padding: 24px 32px 28px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 顶部栏 */
        .topbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .brand-mark {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-emblem {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: conic-gradient(from 200deg, #ffd66b, #ff7f6b, #8b6cff, #4fd4ff, #ffd66b);
            position: relative;
            overflow: hidden;
        }

        .brand-emblem::after {
            content: "";
            position: absolute;
            inset: 4px;
            border-radius: 10px;
            background: radial-gradient(circle at 30% 0%, #ffffffaa, transparent 60%);
            mix-blend-mode: screen;
        }

        .brand-text-main {
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .brand-text-sub {
            font-size: 0.72rem;
            opacity: 0.7;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .mode-toggle-group {
            display: inline-flex;
            align-items: center;
            padding: 4px;
            border-radius: 999px;
            background: radial-gradient(circle at top left, rgba(255,255,255,0.2), rgba(255,255,255,0.02));
            box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
        }

        .temp-switch {
            border: none;
            padding: 6px 14px;
            font-size: 0.82rem;
            border-radius: 999px;
            cursor: pointer;
            background: transparent;
            color: rgba(245,247,255,0.7);
            transition: all 0.25s ease;
        }

        .temp-switch.active {
            background: rgba(10,14,40,0.9);
            color: #f5f7ff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.45);
        }

        /* 搜索与位置栏 */
        .search-row {
            display: grid;
            grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.4fr);
            gap: 14px;
            margin-bottom: 24px;
            margin-top: 6px;
        }

        .search-field {
            position: relative;
        }

        .search-input-box {
            width: 100%;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.16);
            background: rgba(5,8,22,0.85);
            padding: 10px 40px 10px 16px;
            color: #f5f7ff;
            font-size: 0.9rem;
            outline: none;
            box-shadow: 0 12px 30px rgba(0,0,0,0.55);
        }

        .search-input-box::placeholder {
            color: rgba(215, 218, 255, 0.45);
        }

        .search-icon-placeholder {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .geo-chip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 16px;
            padding: 10px 14px;
            background: linear-gradient(135deg, rgba(115, 179, 255, 0.22), rgba(251, 158, 255, 0.15));
            box-shadow: 0 14px 35px rgba(2, 5, 26, 0.8);
            border: 1px solid rgba(178, 209, 255, 0.45);
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.16s ease;
        }

        .geo-chip:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 40px rgba(2, 5, 26, 0.9);
        }

        .geo-main-label {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .geo-secondary {
            font-size: 0.74rem;
            opacity: 0.75;
        }

        .geo-pin {
            width: 24px;
            height: 24px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 30% 0%, #fff1c1, #ff7f6b);
            box-shadow: 0 0 0 2px rgba(5,8,22,0.9);
            font-size: 0.78rem;
        }

        /* 当前天气区域 */
        .live-weather-block {
            flex: 1;
            display: grid;
            grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.1fr);
            gap: 18px;
            align-items: stretch;
            margin-bottom: 20px;
            position: relative;
        }

        .current-card {
            border-radius: 22px;
            background:
                radial-gradient(circle at 10% 0, rgba(255,255,255,0.22), transparent 55%),
                radial-gradient(circle at 120% 120%, rgba(118,188,255,0.5), transparent 50%),
                rgba(7, 12, 40, 0.95);
            padding: 18px 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.85);
            position: relative;
            overflow: hidden;
        }

        .current-card::before {
            content: "";
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(255,255,255,0.09), transparent 70%);
            right: -160px;
            top: -120px;
            opacity: 0.7;
        }

        .current-top-line {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 18px;
            position: relative;
            z-index: 1;
        }

        .city-name {
            font-size: 1.35rem;
            font-weight: 600;
        }

        .update-time {
            font-size: 0.76rem;
            opacity: 0.75;
        }

        .weather-badge {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.72rem;
            background: rgba(23, 34, 80, 0.8);
            border: 1px solid rgba(168, 190, 255, 0.72);
        }

        .current-main-info {
            display: flex;
            align-items: flex-end;
            gap: 18px;
            position: relative;
            z-index: 1;
        }

        .temp-display {
            font-size: 3.8rem;
            font-weight: 600;
            line-height: 1;
        }

        .temp-unit-small {
            font-size: 1.4rem;
            opacity: 0.8;
        }

        .condition-text {
            font-size: 1rem;
            margin-top: 4px;
            opacity: 0.92;
        }

        .feels-text {
            font-size: 0.82rem;
            opacity: 0.75;
        }

        .icon-orbit {
            margin-left: auto;
            width: 120px;
            height: 120px;
            position: relative;
        }

        .orbit-sphere {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 0, #fff8cd, #ffd06b, #ff9f6b);
            box-shadow: 0 16px 45px rgba(255, 159, 107, 0.8);
        }

        .orbit-ring {
            position: absolute;
            inset: 16px;
            border-radius: 50%;
            border: 1px dashed rgba(4, 7, 30, 0.4);
            box-shadow: 0 0 25px rgba(255,255,255,0.08) inset;
        }

        .orbit-cloud {
            position: absolute;
            bottom: 8px;
            left: -8px;
            right: -6px;
            height: 40px;
            border-radius: 999px;
            background: radial-gradient(circle at 20% 0, #ffffff, #d9e2ff);
            box-shadow: 0 12px 30px rgba(2, 4, 18, 0.8);
        }

        /* 当前详情小卡片 */
        .details-grid {
            margin-top: 18px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            position: relative;
            z-index: 1;
        }

        .mini-stat {
            border-radius: 14px;
            padding: 10px 10px;
            background: rgba(8, 13, 45, 0.95);
            border: 1px solid rgba(161, 181, 255, 0.26);
            font-size: 0.78rem;
        }

        .mini-label {
            opacity: 0.7;
            margin-bottom: 6px;
        }

        .mini-value {
            font-weight: 500;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .mini-unit {
            font-size: 0.7rem;
            opacity: 0.7;
        }

        .trend-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4fd4ff;
            box-shadow: 0 0 12px rgba(79, 212, 255, 0.9);
        }

        /* 右边的今天时间线 */
        .timeline-card {
            border-radius: 20px;
            padding: 16px 16px 14px;
            background: rgba(5, 8, 26, 0.96);
            border: 1px solid rgba(153, 173, 255, 0.36);
            box-shadow: 0 22px 55px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 10px;
        }

        .timeline-title {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .day-selector-row {
            display: inline-flex;
            gap: 6px;
            background: rgba(255,255,255,0.04);
            padding: 4px;
            border-radius: 999px;
        }

        .day-chip {
            border-radius: 999px;
            border: none;
            padding: 4px 10px;
            font-size: 0.72rem;
            cursor: pointer;
            background: transparent;
            color: rgba(230,235,255,0.7);
            transition: all 0.2s ease;
        }

        .day-chip.active {
            background: rgba(78, 121, 255, 0.8);
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(26, 63, 199, 0.8);
        }

        .timeline-strip {
            margin-top: 10px;
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(72px, 1fr);
            overflow-x: auto;
            gap: 8px;
            padding-bottom: 4px;
        }

        .timeline-strip::-webkit-scrollbar {
            height: 4px;
        }

        .timeline-strip::-webkit-scrollbar-track {
            background: transparent;
        }

        .timeline-strip::-webkit-scrollbar-thumb {
            background: rgba(148, 167, 255, 0.7);
            border-radius: 999px;
        }

        .hour-slot {
            border-radius: 14px;
            padding: 8px 8px 10px;
            background: radial-gradient(circle at 0 0, rgba(255,255,255,0.11), rgba(4,8,38,1));
            border: 1px solid rgba(171, 185, 255, 0.38);
            font-size: 0.74rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 90px;
        }

        .hour-label {
            opacity: 0.75;
        }

        .hour-temp {
            font-weight: 500;
            font-size: 0.92rem;
        }

        .hour-icon-mini {
            width: 26px;
            height: 26px;
            border-radius: 999px;
            background: radial-gradient(circle at 30% 0, #fff9d8, #ffbb6b);
            box-shadow: 0 8px 18px rgba(255, 187, 107, 0.7);
        }

        .hour-status {
            opacity: 0.7;
            font-size: 0.7rem;
        }

        /* 右侧预报面板 */
        .secondary-panel {
            padding: 22px 22px 22px 20px;
            border-left: 1px solid rgba(209, 220, 255, 0.18);
            background: radial-gradient(circle at 0 0, rgba(255,255,255,0.06), transparent 52%),
                        radial-gradient(circle at 100% 100%, rgba(92,139,255,0.3), transparent 60%),
                        rgba(4, 8, 30, 0.98);
            display: flex;
            flex-direction: column;
        }

        .side-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .side-heading-title {
            font-size: 0.92rem;
            font-weight: 500;
        }

        .side-caption {
            font-size: 0.78rem;
            opacity: 0.7;
        }

        .future-list {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .future-row {
            border-radius: 16px;
            padding: 10px 11px;
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) 0.9fr 1.2fr;
            gap: 6px;
            align-items: center;
            background: rgba(7, 12, 45, 0.96);
            border: 1px solid rgba(159, 183, 255, 0.32);
            box-shadow: 0 10px 26px rgba(0,0,0,0.7);
        }

        .future-row.active {
            background: linear-gradient(120deg, rgba(117, 170, 255, 0.3), rgba(244, 162, 255, 0.3));
            border-color: rgba(232, 241, 255, 0.88);
        }

        .future-day-label {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .future-date-label {
            font-size: 0.7rem;
            opacity: 0.7;
        }

        .future-status {
            font-size: 0.78rem;
            opacity: 0.88;
        }

        .future-temp-range {
            text-align: right;
            font-size: 0.86rem;
        }

        .future-max {
            font-weight: 500;
        }

        .future-min {
            opacity: 0.7;
            margin-left: 6px;
        }

        .precip-chip {
            justify-self: center;
            font-size: 0.74rem;
            padding: 4px 9px;
            border-radius: 999px;
            border: 1px solid rgba(120, 184, 255, 0.7);
            background: rgba(27, 51, 97, 0.95);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .precip-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4fd4ff;
            box-shadow: 0 0 10px rgba(79, 212, 255, 0.9);
        }

        .side-footer {
            margin-top: 16px;
            padding-top: 10px;
            border-top: 1px dashed rgba(181, 194, 255, 0.35);
            font-size: 0.76rem;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: center;
        }

        .aq-pill {
            padding: 4px 8px;
            border-radius: 999px;
            border: 1px solid rgba(169, 232, 183, 0.8);
            background: rgba(18, 66, 39, 0.92);
            font-size: 0.74rem;
        }

        /* 底部角标 */
        .corner-credit {
            position: absolute;
            right: 20px;
            bottom: 14px;
            font-size: 0.72rem;
            opacity: 0.55;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* 响应式 */
        @media (max-width: 960px) {
            .shell-layout {
                grid-template-columns: minmax(0, 1fr);
                min-height: auto;
            }

            .secondary-panel {
                border-left: none;
                border-top: 1px solid rgba(209, 220, 255, 0.18);
                padding-top: 18px;
            }
        }

        @media (max-width: 720px) {
            body {
                align-items: flex-start;
            }

            .shell-layout {
                margin-top: 10px;
                border-radius: 22px;
            }

            .primary-panel {
                padding: 18px 18px 20px;
            }

            .secondary-panel {
                padding: 18px;
            }

            .live-weather-block {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        @media (max-width: 520px) {
            .search-row {
                grid-template-columns: minmax(0, 1fr);
            }

            .current-card {
                padding: 16px 14px;
            }

            .details-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .timeline-strip {
                grid-auto-columns: minmax(82px, 1fr);
            }
        }
    </style>
</head>
<body>
<div class="shell-layout">
    <!-- 左侧主区域 -->
    <section class="primary-panel">
        <header class="topbar-row">
            <div class="brand-mark">
                <div class="brand-emblem"></div>
                <div>
                    <div class="brand-text-main">SkyPulse</div>
                    <div class="brand-text-sub">PRECISION WEATHER SUITE</div>
                </div>
            </div>
            <div class="mode-toggle-group" id="unitToggle">
                <button class="temp-switch active" data-unit="c">℃</button>
                <button class="temp-switch" data-unit="f">℉</button>
            </div>
        </header>

        <div class="search-row">
            <div class="search-field">
                <input
                    type="text"
                    class="search-input-box"
                    id="cityInput"
                    placeholder="搜索城市，例如：Shanghai, Tokyo, New York..."
                >
                <span class="search-icon-placeholder">⌕</span>
            </div>
            <button class="geo-chip" id="locBtn">
                <div>
                    <div class="geo-main-label">使用当前位置</div>
                    <div class="geo-secondary">One-tap定位并刷新预报</div>
                </div>
                <div class="geo-pin">◎</div>
            </button>
        </div>

        <div class="live-weather-block">
            <!-- 当前天气卡片 -->
            <article class="current-card">
                <div class="current-top-line">
                    <div>
                        <div class="city-name" id="cityName">Tokyo, Japan</div>
                        <div class="update-time" id="updateTime">更新于 14:32 · 本地时间</div>
                    </div>
                    <div class="weather-badge" id="badgeText">稳定 · 无降水</div>
                </div>

                <div class="current-main-info">
                    <div>
                        <div class="temp-display">
                            <span id="tempMain">27</span><span class="temp-unit-small">°</span>
                        </div>
                        <div class="condition-text" id="conditionText">部分多云 · 微风</div>
                        <div class="feels-text" id="feelsLikeText">体感 29° · 舒适度良好</div>
                    </div>
                    <div class="icon-orbit">
                        <div class="orbit-sphere"></div>
                        <div class="orbit-ring"></div>
                        <div class="orbit-cloud"></div>
                    </div>
                </div>

                <div class="details-grid">
                    <div class="mini-stat">
                        <div class="mini-label">风速</div>
                        <div class="mini-value"><span id="windVal">12</span><span class="mini-unit">km/h 东北风</span></div>
                    </div>
                    <div class="mini-stat">
                        <div class="mini-label">湿度</div>
                        <div class="mini-value">
                            <span id="humidityVal">64</span><span class="mini-unit">%</span>
                            <span class="trend-dot"></span>
                        </div>
                    </div>
                    <div class="mini-stat">
                        <div class="mini-label">气压</div>
                        <div class="mini-value">
                            <span id="pressureVal">1013</span><span class="mini-unit">hPa</span>
                        </div>
                    </div>
                </div>
            </article>

            <!-- 今天小时预报时间线 -->
            <aside class="timeline-card">
                <div class="timeline-header">
                    <div class="timeline-title">今日逐小时趋势</div>
                    <div class="day-selector-row" id="daySelector">
                        <button class="day-chip active" data-day="0">今天</button>
                        <button class="day-chip" data-day="1">明天</button>
                        <button class="day-chip" data-day="2">后天</button>
                    </div>
                </div>
                <div class="timeline-strip" id="hourlyStrip">
                    <!-- JS填充 -->
                </div>
            </aside>
        </div>

        <div class="corner-credit">
            Designed for precision-focused clients · SkyPulse Studio
        </div>
    </section>

    <!-- 右侧未来预报 -->
    <aside class="secondary-panel">
        <div class="side-heading">
            <div>
                <div class="side-heading-title">未来 7 日预报</div>
                <div class="side-caption">温度波动与降水概率一目了然</div>
            </div>
        </div>

        <div class="future-list" id="futureList">
            <!-- JS填充 -->
        </div>

        <div class="side-footer">
            <div class="aq-pill" id="aqPill">空气质量 · 良 (AQI 42)</div>
            <div>数据为演示示例，可接入任意天气 API</div>
        </div>
    </aside>
</div>

<script>
    // 简单演示数据（可替换为真实 API 返回值）
    const demoWeather = {
        unit: 'c',
        current: {
            city: 'Tokyo, Japan',
            tempC: 27,
            condition: '部分多云 · 微风',
            feelsC: 29,
            wind: '12 km/h 东北风',
            humidity: 64,
            pressure: 1013,
            badge: '稳定 · 无降水',
            updated: '更新于 14:32 · 本地时间'
        },
        hourly: [
            // dayIndex 0 = 今天
            [
                { time: '现在', tempC: 27, status: '多云', type: 'day' },
                { time: '15:00', tempC: 28, status: '晴间多云', type: 'day' },
                { time: '16:00', tempC: 27, status: '晴朗', type: 'day' },
                { time: '17:00', tempC: 25, status: '微风', type: 'day' },
                { time: '18:00', tempC: 23, status: '傍晚清凉', type: 'night' },
                { time: '19:00', tempC: 22, status: '少云', type: 'night' },
                { time: '20:00', tempC: 21, status: '能见度佳', type: 'night' }
            ],
            // dayIndex 1 = 明天
            [
                { time: '08:00', tempC: 23, status: '早晨晴朗', type: 'day' },
                { time: '11:00', tempC: 27, status: '阳光充足', type: 'day' },
                { time: '14:00', tempC: 29, status: '略感闷热', type: 'day' },
                { time: '17:00', tempC: 26, status: '转多云', type: 'day' },
                { time: '20:00', tempC: 22, status: '晚间清爽', type: 'night' }
            ],
            // dayIndex 2 = 后天
            [
                { time: '08:00', tempC: 21, status: '清晨凉爽', type: 'day' },
                { time: '11:00', tempC: 25, status: '薄云', type: 'day' },
                { time: '14:00', tempC: 26, status: '舒适', type: 'day' },
                { time: '17:00', tempC: 24, status: '微风', type: 'day' },
                { time: '20:00', tempC: 21, status: '云层增多', type: 'night' }
            ]
        ],
        future: [
            { label: '今天', date: '周五 · 11/14', maxC: 28, minC: 21, status: '多云转晴', rain: 10 },
            { label: '明天', date: '周六 · 11/15', maxC: 29, minC: 22, status: '晴朗偏热', rain: 5 },
            { label: '周日', date: '周日 · 11/16', maxC: 27, minC: 20, status: '温度舒适', rain: 12 },
            { label: '周一', date: '周一 · 11/17', maxC: 24, minC: 18, status: '短时小雨', rain: 40 },
            { label: '周二', date: '周二 · 11/18', maxC: 23, minC: 17, status: '阵雨转阴', rain: 55 },
            { label: '周三', date: '周三 · 11/19', maxC: 25, minC: 18, status: '多云', rain: 20 },
            { label: '周四', date: '周四 · 11/20', maxC: 26, minC: 19, status: '少云', rain: 8 }
        ]
    };

    const tempMainEl = document.getElementById('tempMain');
    const conditionTextEl = document.getElementById('conditionText');
    const feelsLikeTextEl = document.getElementById('feelsLikeText');
    const cityNameEl = document.getElementById('cityName');
    const updateTimeEl = document.getElementById('updateTime');
    const badgeTextEl = document.getElementById('badgeText');
    const windValEl = document.getElementById('windVal');
    const humidityValEl = document.getElementById('humidityVal');
    const pressureValEl = document.getElementById('pressureVal');
    const hourlyStripEl = document.getElementById('hourlyStrip');
    const futureListEl = document.getElementById('futureList');
    const unitToggleEl = document.getElementById('unitToggle');

    // 将摄氏转换为华氏
    function cToF(c) {
        return Math.round(c * 9 / 5 + 32);
    }

    function getTempWithUnit(c) {
        return demoWeather.unit === 'c' ? c : cToF(c);
    }

    function renderCurrent() {
        const c = demoWeather.current;
        cityNameEl.textContent = c.city;
        updateTimeEl.textContent = c.updated;
        conditionTextEl.textContent = c.condition;
        badgeTextEl.textContent = c.badge;
        windValEl.textContent = c.wind.replace('km/h 东北风', demoWeather.unit === 'c' ? 'km/h 东北风' : 'mph NE wind');
        humidityValEl.textContent = c.humidity;
        pressureValEl.textContent = c.pressure;

        const tempVal = getTempWithUnit(c.tempC);
        const feelsVal = getTempWithUnit(c.feelsC);
        tempMainEl.textContent = tempVal;
        const unitSymbol = demoWeather.unit === 'c' ? '°C' : '°F';
        feelsLikeTextEl.textContent = `体感 ${feelsVal}° · ${unitSymbol} 模式`;
    }

    function renderHourly(dayIndex) {
        hourlyStripEl.innerHTML = '';
        const list = demoWeather.hourly[dayIndex] || [];

        list.forEach(item => {
            const slot = document.createElement('div');
            slot.className = 'hour-slot';

            const iconMini = document.createElement('div');
            iconMini.className = 'hour-icon-mini';
            if (item.type === 'night') {
                iconMini.style.background = 'radial-gradient(circle at 30% 0, #f9f7ff, #9b8cff)';
                iconMini.style.boxShadow = '0 8px 18px rgba(155, 140, 255, 0.7)';
            }

            slot.innerHTML = `
                <div class="hour-label">${item.time}</div>
            `;
            slot.appendChild(iconMini);

            const tempSpan = document.createElement('div');
            tempSpan.className = 'hour-temp';
            tempSpan.textContent = `${getTempWithUnit(item.tempC)}°`;
            slot.appendChild(tempSpan);

            const status = document.createElement('div');
            status.className = 'hour-status';
            status.textContent = item.status;
            slot.appendChild(status);

            hourlyStripEl.appendChild(slot);
        });
    }

    function renderFuture() {
        futureListEl.innerHTML = '';
        demoWeather.future.forEach((d, index) => {
            const row = document.createElement('div');
            row.className = 'future-row' + (index === 0 ? ' active' : '');

            const maxVal = getTempWithUnit(d.maxC);
            const minVal = getTempWithUnit(d.minC);

            row.innerHTML = `
                <div>
                    <div class="future-day-label">${d.label}</div>
                    <div class="future-date-label">${d.date}</div>
                </div>
                <div class="precip-chip">
                    <span class="precip-dot"></span>
                    <span>${d.rain}% 降水</span>
                </div>
                <div class="future-temp-range">
                    <span class="future-max">${maxVal}°</span>
                    <span class="future-min">${minVal}°</span>
                    <div class="future-status">${d.status}</div>
                </div>
            `;
            futureListEl.appendChild(row);
        });
    }

    // 单位切换
    unitToggleEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.temp-switch');
        if (!btn) return;
        const value = btn.getAttribute('data-unit');
        if (value && value !== demoWeather.unit) {
            demoWeather.unit = value;

            unitToggleEl.querySelectorAll('.temp-switch').forEach(b => {
                b.classList.toggle('active', b === btn);
            });

            renderCurrent();
            // 根据当前激活的日标签重绘
            const activeDayBtn = document.querySelector('.day-chip.active');
            const idx = Number(activeDayBtn?.getAttribute('data-day') || 0);
            renderHourly(idx);
            renderFuture();
        }
    });

    // 日选择
    document.getElementById('daySelector').addEventListener('click', (e) => {
        const btn = e.target.closest('.day-chip');
        if (!btn) return;
        document.querySelectorAll('.day-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const idx = Number(btn.getAttribute('data-day') || 0);
        renderHourly(idx);
    });

    // 输入框模拟搜索（这里只做视觉反馈）
    document.getElementById('cityInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const value = e.target.value.trim();
            if (!value) return;
            // 真正接 API 时在这里发请求即可
            cityNameEl.textContent = value;
            badgeTextEl.textContent = '示例模式 · 等待真实数据';
            updateTimeEl.textContent = '已模拟切换城市';
        }
    });

    // 位置按钮点击示例
    document.getElementById('locBtn').addEventListener('click', () => {
        badgeTextEl.textContent = '正在模拟定位...';
        setTimeout(() => {
            badgeTextEl.textContent = '定位成功 · 示例位置';
            cityNameEl.textContent = 'Current Location';
        }, 800);
    });

    // 初始化渲染
    renderCurrent();
    renderHourly(0);
    renderFuture();
</script>
</body>
</html>
